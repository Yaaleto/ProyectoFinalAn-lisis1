services:
  database:
    image: mysql:8.4
    container_name: bovitrack-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: bovitrack
      MYSQL_USER: bovitrack
      MYSQL_PASSWORD: change-me
      MYSQL_ROOT_PASSWORD: root-change-me
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - bovitrack_mysql_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/01-test-database.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s

volumes:
  bovitrack_mysql_data:
